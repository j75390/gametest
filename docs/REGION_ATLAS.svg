<text x="545" y="1035" font-size="17" fill="#adb69e">남쪽으로 열린 출구 · 외부 마을로 이어짐</text>
<rect x="645" y="170" width="350" height="110" rx="8" fill="#171b20" stroke="#ad9465" stroke-width="2"/><text x="663" y="200" font-size="23" fill="#ead3a5">V  새벽 없는 성소</text><text x="663" y="228" font-size="16" fill="#b3c1bb">+220m · 분배 / 북쪽 절벽 내부</text><text x="663" y="256" font-size="16" fill="#e0dcd0">쉼표 자리에 적힌 다음 사람의 번호</text><rect x="225" y="280" width="320" height="110" rx="8" fill="#171b20" stroke="#ad9465" stroke-width="2"/><text x="243" y="310" font-size="23" fill="#ead3a5">IV  이름 없는 서고</text><text x="243" y="338" font-size="16" fill="#b3c1bb">+150m · 삭제 / 건조한 암반</text><text x="243" y="366" font-size="16" fill="#e0dcd0">책보다 한 장 많은 반납표</text><rect x="920" y="435" width="355" height="110" rx="8" fill="#171b20" stroke="#ad9465" stroke-width="2"/><text x="938" y="465" font-size="23" fill="#ead3a5">III  유리 온실</text><text x="938" y="493" font-size="16" fill="#b3c1bb">+80m · 증류 / 햇빛 드는 단구</text><text x="938" y="521" font-size="16" fill="#e0dcd0">닫힌 날만 대답이 줄어드는 작업표</text><rect x="655" y="655" width="325" height="110" rx="8" fill="#171b20" stroke="#ad9465" stroke-width="2"/><text x="673" y="685" font-size="23" fill="#ead3a5">II  검은 운하</text><text x="673" y="713" font-size="16" fill="#b3c1bb">0~+15m · 운송 / 저지대 갑문</text><text x="673" y="741" font-size="16" fill="#e0dcd0">빈 배가 더 깊이 잠기는 까닭</text><rect x="195" y="640" width="330" height="110" rx="8" fill="#171b20" stroke="#ad9465" stroke-width="2"/><text x="213" y="670" font-size="23" fill="#ead3a5">I  잿빛 성당</text><text x="213" y="698" font-size="16" fill="#b3c1bb">+45m · 기록 / 홍수 위의 언덕</text><text x="213" y="726" font-size="16" fill="#e0dcd0">완치 기록은 있으나 퇴원 칸은 비었다</text><rect x="495" y="890" width="405" height="110" rx="8" fill="#171b20" stroke="#ad9465" stroke-width="2"/><text x="513" y="920" font-size="23" fill="#ead3a5">출발  남쪽 마을</text><text x="513" y="948" font-size="16" fill="#b3c1bb">+10m · 제방 / 밭 / 수선방 / 등불</text><text x="513" y="976" font-size="16" fill="#e0dcd0">우리가 돌아와야 하는 생활의 자리</text><rect x="1265" y="770" width="290" height="266" rx="8" fill="#1b2026" stroke="#485058"/>
<text x="1285" y="803" font-size="20" fill="#ead3a5">지도 범례</text>
<text x="1285" y="841" font-size="17" fill="#e2be78">금색 → 원정 진행</text>
<text x="1285" y="876" font-size="17" fill="#87b8cd">청색 → 하천 / 관리 수로</text>
<text x="1285" y="911" font-size="17" fill="#b7afa2">점선 → 파손된 옛 길</text>
<text x="1285" y="946" font-size="17">높이 → 분지 바닥 기준</text>
<text x="1285" y="981" font-size="16" fill="#a9aeb0">개념 배치 · 축척은 비례하지 않음</text>
<text x="1285" y="1012" font-size="16" fill="#a9aeb0">폭 약 8km / 남북 약 11km 제안</text>
