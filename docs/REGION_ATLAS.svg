<text x="1468" y="140" font-size="24">북</text>
<text x="65" y="1092" font-size="17" fill="#aaa79d">관측 → 대조 → 기록 갱신. 숨은 보상이나 후반 진실을 플레이어 지도에 미리 표시하지 않는다.</text>
